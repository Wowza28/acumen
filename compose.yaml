services:
  acumen:
    image: ghcr.io/wowza28/acumen:latest
    # To build locally instead of pulling the pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: acumen
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=file:/app/prisma/dev.db
      - UPLOAD_DIR=/app/uploads
      # You can configure credentials here or directly inside the app Settings UI:
      # - OPENAI_API_KEY=sk-...
      # - GEMINI_API_KEY=AIza...
      # - TITAN_EMAIL=...
      # - TITAN_PASSWORD=...
    env_file:
      - path: .env
        required: false
    volumes:
      # Bind mounts: ALL persistent data lives in ./data next to this file.
      #   ./data/db      -> SQLite database (dev.db)
      #   ./data/uploads -> uploaded files, contact photos, project logos
      # The schema file itself is baked into the image at /app/schema.prisma
      # (see Dockerfile) so the db mount can never shadow it and block
      # schema updates. NOTE: Dockge keeps its own copy of this file — after
      # pulling repo changes, paste the updated compose file into Dockge too.
      - ./data/db:/app/prisma
      - ./data/uploads:/app/uploads


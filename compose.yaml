services:
  acumen:
    image: ghcr.io/wowza28/acumen:latest
    # To build locally instead of pulling the pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: acumen
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=file:/data/acumen.db
      - UPLOAD_DIR=/data/uploads
      # You can configure credentials here or directly inside the app Settings UI:
      # - OPENAI_API_KEY=sk-...
      # - GEMINI_API_KEY=AIza...
      # - TITAN_EMAIL=...
      # - TITAN_PASSWORD=...
    env_file:
      - path: .env
        required: false
    volumes:
      # Data lives under /data so it never shadows the schema.prisma baked
      # into the image at /app/prisma (that shadowing silently broke `db push`
      # schema updates). Existing dev.db/uploads auto-migrate on first start.
      - acumen_data:/data
      - acumen_uploads:/data/uploads

volumes:
  acumen_data:
  acumen_uploads:


services:
  acumen:
    image: ghcr.io/wowza28/acumen:latest
    # To build locally instead of pulling the pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: acumen
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=file:/app/prisma/dev.db
      - UPLOAD_DIR=/app/uploads
      # You can configure credentials here or directly inside the app Settings UI:
      # - OPENAI_API_KEY=sk-...
      # - GEMINI_API_KEY=AIza...
      # - TITAN_EMAIL=...
      # - TITAN_PASSWORD=...
    env_file:
      - path: .env
        required: false
    volumes:
      # These mounts hold the live database + uploaded files. The schema file
      # itself is baked into the image at /app/schema.prisma (see Dockerfile)
      # so the volume can never shadow it and block schema updates. Do NOT
      # change these paths without also updating your Dockge stack — Dockge
      # keeps its own copy of this file and will not pick up changes here.
      - acumen_data:/app/prisma
      - acumen_uploads:/app/uploads

volumes:
  acumen_data:
  acumen_uploads:

